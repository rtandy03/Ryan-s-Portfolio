<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+SA+Hand:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles/styles2.css" rel="stylesheet">

</head>
<body>
    <script src="script.js"></script>
    <div id="graph-holder">
        <label for="demographic" class="form-label fw-bold">Demographic:</label>
        <select id="demographic" onchange="changeGraph()">
            <option value="">--Select--</option>
            <option value="all">All</option>
            <option value="asian">Asian</option>
            <option value="black">Black</option>
            <option value="hispanic">Hispanic</option>
            <option value="white">White</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
        </select>
        <div id="graph">
            <img id="demo-choice" src="graphs/all.png" alt="Very cool very nice image">
        </div>
    </div>
    <div id="footer">
        <p id="explanation">
        The graphs above show the trends between AI adoption (blue) and average test scores per <br>
        demographic category (green) from 2018-2025. These were the years I believed would show <br>
        the most correlation, since AI use is relitively new, so data from prior years I deemed insignificant.
        </p>
    </div>
</body>
</html>
